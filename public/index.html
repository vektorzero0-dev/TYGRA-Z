<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYGRA-Z // Cybernetic Apex AI</title>
  <style>
    :root {
      --gold: #ffd700;
      --cyan: #00f0ff;
      --bg: #030408;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Consolas', 'Segoe UI', monospace;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(255, 215, 0, 0.12) 0%, transparent 65%),
        linear-gradient(to bottom, #030408 0%, #080c18 100%);
    }

    /* Dev Header */
    .dev-header {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 30;
      background: rgba(10, 14, 23, 0.85);
      padding: 10px 18px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      font-size: 13px;
      backdrop-filter: blur(5px);
    }
    .dev-header .title { color: var(--gold); font-weight: bold; font-size: 16px; letter-spacing: 1px; }
    .dev-header a { color: var(--cyan); text-decoration: none; }

    /* Stage Canvas Robot Harimau */
    .stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Graphic SVG Vector Mecha Tiger */
    .tiger-mecha {
      width: 280px;
      height: 280px;
      filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.4));
      transition: all 0.3s ease;
      animation: idle-breath 3s infinite ease-in-out;
    }

    @keyframes idle-breath {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }

    /* Animasi saat Berbicara */
    .speaking .tiger-mecha {
      animation: speak-pulse 0.5s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 45px rgba(0, 240, 255, 0.8));
    }

    @keyframes speak-pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    /* UI Bottom */
    .ui-bottom {
      width: 100%;
      padding: 20px;
      position: absolute;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      background: linear-gradient(to top, rgba(3,4,8,0.95), transparent);
    }

    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    #response-box {
      width: 90%;
      max-width: 600px;
      text-align: center;
      font-size: 14px;
      color: #ececec;
      min-height: 50px;
      background: rgba(10, 14, 23, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .btn-mic {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #b8860b);
      border: 2px solid var(--cyan);
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .btn-mic:hover { transform: scale(1.1); }
    .btn-mic svg { width: 30px; height: 30px; fill: #000; }
    .btn-mic.recording { background: #ff3344; animation: pulse 0.8s infinite alternate; }

    @keyframes pulse {
      0% { box-shadow: 0 0 15px #ff3344; }
      100% { box-shadow: 0 0 35px #ff3344; }
    }
  </style>
</head>
<body id="appBody">

  <!-- Dev Header -->
  <div class="dev-header">
    <div class="title">TYGRA-Z AI</div>
    <div>Developer: <b>Zeeo</b></div>
    <div>Email: <a href="mailto:Vektorzero0@gmail.com">Vektorzero0@gmail.com</a></div>
  </div>

  <!-- Stage Mecha Tiger Vector -->
  <div class="stage">
    <svg class="tiger-mecha" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Telinga Mecha -->
      <polygon points="35,45 65,70 25,80" fill="#ffd700" stroke="#00f0ff" stroke-width="2"/>
      <polygon points="165,45 135,70 175,80" fill="#ffd700" stroke="#00f0ff" stroke-width="2"/>
      
      <!-- Kepala Armor Emas -->
      <polygon points="100,25 155,60 145,130 100,165 55,130 45,60" fill="#121624" stroke="#ffd700" stroke-width="4"/>
      <polygon points="100,35 145,65 135,120 100,150 65,120 55,65" fill="#1a2035"/>
      
      <!-- Loreng Cybernetic Emas -->
      <path d="M70,55 L90,70 L75,80" fill="none" stroke="#ffd700" stroke-width="3"/>
      <path d="M130,55 L110,70 L125,80" fill="none" stroke="#ffd700" stroke-width="3"/>
      <polygon points="100,40 93,55 107,55" fill="#ffd700"/>

      <!-- Mata Visor Neon Cyan -->
      <polygon points="60,85 90,85 85,95 65,95" fill="#00f0ff"/>
      <polygon points="140,85 110,85 115,95 135,95" fill="#00f0ff"/>

      <!-- Hidung & Rahang Robot -->
      <polygon points="100,105 90,120 110,120" fill="#ffd700"/>
      <path d="M80,135 Q100,150 120,135" fill="none" stroke="#00f0ff" stroke-width="3" id="jawLine"/>

      <!-- Core Reactor Dada -->
      <circle cx="100" cy="175" r="12" fill="#00f0ff" stroke="#ffd700" stroke-width="2"/>
    </svg>
  </div>

  <!-- UI Controls -->
  <div class="ui-bottom">
    <div class="status-badge" id="statusText">SYSTEM STANDBY</div>
    <div id="response-box">Tekan mikrofon untuk berbicara dengan TYGRA-Z...</div>
    <button class="btn-mic" id="micBtn" onclick="startListening()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
  </div>

  <script>
    const appBody = document.getElementById('appBody');
    const statusText = document.getElementById('statusText');
    const responseBox = document.getElementById('response-box');
    const micBtn = document.getElementById('micBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'id-ID';

      recognition.onstart = () => {
        statusText.innerText = "MENDENGARKAN...";
        micBtn.classList.add('recording');
      };

      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        responseBox.innerText = `User: "${text}"`;
        statusText.innerText = "MEMPROSES DATA...";

        try {
          const res = await fetch('https://tygra-z-backend.onrender.com/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: text })
          });
          const data = await res.json();
          responseBox.innerText = data.reply;
          speak(data.reply);
        } catch (err) {
          responseBox.innerText = "Gagal terhubung ke backend server.";
          statusText.innerText = "SYSTEM ERROR";
        }
      };

      recognition.onerror = () => {
        statusText.innerText = "SYSTEM STANDBY";
        micBtn.classList.remove('recording');
        appBody.className = "";
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
      };
    }

    function startListening() {
      if (recognition) recognition.start();
      else alert("Browser tidak mendukung Web Speech API.");
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';

      utter.onstart = () => {
        statusText.innerText = "BERBICARA...";
        appBody.className = "speaking";
      };

      utter.onend = () => {
        statusText.innerText = "SYSTEM STANDBY";
        appBody.className = "";
      };

      window.speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
