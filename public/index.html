<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYGRA-Z // Fullstack Cyber Assistant</title>
  <style>
    :root {
      --gold: #ffd700;
      --cyan: #00f0ff;
      --bg: #030408;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Consolas', 'Segoe UI', monospace;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Dev Header */
    .dev-header {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 30;
      background: rgba(10, 14, 23, 0.85);
      padding: 10px 18px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      font-size: 13px;
      backdrop-filter: blur(5px);
    }

    .dev-header .title {
      color: var(--gold);
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .dev-header a { color: var(--cyan); text-decoration: none; }

    /* Canvas 3D Stage */
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* UI Bottom Overlay */
    .ui-bottom {
      width: 100%;
      padding: 20px;
      position: absolute;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      background: linear-gradient(to top, rgba(3,4,8,0.95), transparent);
    }

    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
    }

    #response-box {
      width: 90%;
      max-width: 600px;
      text-align: center;
      font-size: 14px;
      color: #ececec;
      min-height: 50px;
      background: rgba(10, 14, 23, 0.85);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .btn-mic {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #b8860b);
      border: 2px solid var(--cyan);
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-mic:hover { transform: scale(1.1); box-shadow: 0 0 35px rgba(255, 215, 0, 0.7); }
    .btn-mic svg { width: 30px; height: 30px; fill: #000; }
    .btn-mic.recording { background: #ff3344; border-color: #fff; animation: pulse-red 0.8s infinite alternate; }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 15px #ff3344; }
      100% { box-shadow: 0 0 35px #ff3344; }
    }
  </style>
</head>
<body>

  <!-- Dev Header -->
  <div class="dev-header">
    <div class="title">TYGRA-Z AI</div>
    <div>Developer: <b>Zeeo</b></div>
    <div>Email: <a href="mailto:Vektorzero0@gmail.com">Vektorzero0@gmail.com</a></div>
  </div>

  <!-- Area Render 3D Robot -->
  <div id="canvas-container"></div>

  <!-- UI Interface Bottom -->
  <div class="ui-bottom">
    <div class="status-badge" id="statusText">SYSTEM STANDBY</div>
    <div id="response-box">Tekan mikrofon untuk berbicara dengan TYGRA-Z...</div>
    <button class="btn-mic" id="micBtn" onclick="startListening()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
  </div>

  <!-- Library Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>

  <script>
    // --- THREE.JS 3D ROBOT GENERATOR ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030408, 0.05);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 1, 4.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Membuat Robot Cybernetic dari Partikel Mesh
    const robotGroup = new THREE.Group();
    scene.add(robotGroup);

    // Partikel Cahaya Keemasan & Cyan
    const particleCount = 2500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const colorGold = new THREE.Color(0xffd700);
    const colorCyan = new THREE.Color(0x00f0ff);

    for (let i = 0; i < particleCount; i++) {
      // Pembentukan Anatomi Stand Robot (Kepala, Dada, Tangan, Kaki)
      let x, y, z;
      const part = Math.random();

      if (part < 0.25) { // Kepala Harimau Mecha
        x = (Math.random() - 0.5) * 0.8;
        y = 1.2 + (Math.random() - 0.5) * 0.6;
        z = (Math.random() - 0.5) * 0.7;
      } else if (part < 0.65) { // Dada Armor & Reaktor
        x = (Math.random() - 0.5) * 1.2;
        y = 0.3 + (Math.random() - 0.5) * 0.9;
        z = (Math.random() - 0.5) * 0.8;
      } else { // Kaki & Tangan Berdiri
        x = (Math.random() - 0.5) * 1.5;
        y = -0.8 + (Math.random() - 0.5) * 1.2;
        z = (Math.random() - 0.5) * 0.8;
      }

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      const mixedColor = Math.random() > 0.3 ? colorGold : colorCyan;
      colors[i * 3] = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.035,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    const robotParticles = new THREE.Points(geometry, material);
    robotGroup.add(robotParticles);

    // Reaktor Inti (Core Reactor Glowing Sphere)
    const coreGeo = new THREE.SphereGeometry(0.18, 16, 16);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    coreMesh.position.set(0, 0.4, 0.1);
    robotGroup.add(coreMesh);

    // Animasi Rotasi & Bernapas (Breathing Idle)
    let clock = new THREE.Clock();
    let isSpeaking = false;

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Efek Bernapas Naik-Turun
      robotGroup.position.y = Math.sin(time * 2) * 0.05;
      robotGroup.rotation.y = Math.sin(time * 0.5) * 0.15;

      // Reaktor Membesar Saat Berbicara
      if (isSpeaking) {
        coreMesh.scale.setScalar(1 + Math.sin(time * 15) * 0.3);
      } else {
        coreMesh.scale.set(1, 1, 1);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // --- INTEGRASI VOICE & RENDER BACKEND ---
    const statusText = document.getElementById('statusText');
    const responseBox = document.getElementById('response-box');
    const micBtn = document.getElementById('micBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'id-ID';
      recognition.onstart = () => { statusText.innerText = "MENDENGARKAN..."; micBtn.classList.add('recording'); };
      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        responseBox.innerText = `User: "${text}"`;
        statusText.innerText = "MEMPROSES DATA...";

        try {
          // Panggil Backend di Render.com (Sesuaikan link ini jika perlu)
          const res = await fetch('https://tygra-z-backend.onrender.com/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: text })
          });
          const data = await res.json();
          responseBox.innerText = data.reply;
          speak(data.reply);
        } catch (err) {
          responseBox.innerText = "Gagal terhubung ke backend server.";
          statusText.innerText = "SYSTEM ERROR";
        }
      };
      recognition.onerror = () => { statusText.innerText = "SYSTEM STANDBY"; micBtn.classList.remove('recording'); };
      recognition.onend = () => { micBtn.classList.remove('recording'); };
    }

    function startListening() {
      if (recognition) recognition.start();
      else alert("Browser tidak mendukung Web Speech API.");
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      utter.onstart = () => { statusText.innerText = "BERBICARA..."; isSpeaking = true; };
      utter.onend = () => { statusText.innerText = "SYSTEM STANDBY"; isSpeaking = false; };
      window.speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
