<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYGRA-Z // Fullstack Cyber Assistant</title>
  <style>
    :root {
      --gold: #ffd700;
      --cyan: #00f0ff;
      --bg: #030408;
      --panel-bg: rgba(10, 14, 23, 0.85);
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Consolas', 'Segoe UI', monospace;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(255, 215, 0, 0.1) 0%, transparent 60%),
        linear-gradient(to bottom, #030408 0%, #0a0d18 100%);
    }

    /* Dev Header */
    .dev-header {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 30;
      background: var(--panel-bg);
      padding: 10px 18px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
      font-size: 13px;
      backdrop-filter: blur(5px);
    }

    .dev-header .title {
      color: var(--gold);
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .dev-header a { color: var(--cyan); text-decoration: none; }

    /* Area Display Avatar Cyberpunk */
    .stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: 20px;
    }

    .avatar-card {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--gold), #8a6d00, var(--cyan));
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3), 0 0 50px rgba(0, 240, 255, 0.2);
      transition: all 0.3s ease-in-out;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #030408;
    }

    /* Animasi Status Avatar */
    .avatar-card.listening {
      animation: pulse-cyan 1.2s infinite alternate;
    }

    .avatar-card.speaking {
      animation: pulse-gold 0.8s infinite alternate;
    }

    @keyframes pulse-cyan {
      0% { box-shadow: 0 0 20px var(--cyan); transform: scale(1); }
      100% { box-shadow: 0 0 60px var(--cyan), 0 0 90px var(--cyan); transform: scale(1.03); }
    }

    @keyframes pulse-gold {
      0% { box-shadow: 0 0 25px var(--gold); transform: scale(1); }
      100% { box-shadow: 0 0 70px var(--gold), 0 0 100px var(--gold); transform: scale(1.04); }
    }

    /* Interface Overlay Bottom */
    .ui-bottom {
      width: 100%;
      padding: 20px;
      background: linear-gradient(to top, rgba(3,4,8,0.95), transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
    }

    #response-box {
      width: 90%;
      max-width: 600px;
      text-align: center;
      font-size: 14px;
      color: #ececec;
      min-height: 50px;
      background: var(--panel-bg);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .btn-mic {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #b8860b);
      border: 2px solid var(--cyan);
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-mic:hover { transform: scale(1.1); box-shadow: 0 0 35px rgba(255, 215, 0, 0.7); }
    .btn-mic svg { width: 30px; height: 30px; fill: #000; }
    .btn-mic.recording { background: #ff3344; border-color: #fff; animation: pulse-red 0.8s infinite alternate; }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 15px #ff3344; }
      100% { box-shadow: 0 0 35px #ff3344; }
    }
  </style>
</head>
<body>

  <!-- Dev Header -->
  <div class="dev-header">
    <div class="title">TYGRA-Z AI</div>
    <div>Developer: <b>Zeeo</b></div>
    <div>Email: <a href="mailto:Vektorzero0@gmail.com">Vektorzero0@gmail.com</a></div>
  </div>

  <!-- Stage Cyber Avatar -->
  <div class="stage">
    <div class="avatar-card" id="avatarCard">
      <img src="https://images.unsplash.com/photo-1561731216-c3a4d99437d5?auto=format&fit=crop&w=600&q=80" class="avatar-img" alt="TYGRA-Z">
    </div>
  </div>

  <!-- UI Interface -->
  <div class="ui-bottom">
    <div class="status-badge" id="statusText">SYSTEM STANDBY</div>
    <div id="response-box">Tekan mikrofon untuk berbicara dengan TYGRA-Z...</div>
    <button class="btn-mic" id="micBtn" onclick="startListening()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
  </div>

  <script>
    const avatarCard = document.getElementById('avatarCard');
    const statusText = document.getElementById('statusText');
    const responseBox = document.getElementById('response-box');
    const micBtn = document.getElementById('micBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'id-ID';

      recognition.onstart = () => {
        statusText.innerText = "MENDENGARKAN...";
        micBtn.classList.add('recording');
        avatarCard.className = "avatar-card listening";
      };

      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        responseBox.innerText = `User: "${text}"`;
        statusText.innerText = "MEMPROSES DATA...";

        try {
          // Panggil Backend Server di Render
          const res = await fetch('https://tygra-z-backend.onrender.com/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: text })
          });
          const data = await res.json();
          responseBox.innerText = data.reply;
          speak(data.reply);
        } catch (err) {
          responseBox.innerText = "Gagal terhubung ke backend server.";
          statusText.innerText = "SYSTEM ERROR";
          avatarCard.className = "avatar-card";
        }
      };

      recognition.onerror = () => {
        statusText.innerText = "SYSTEM STANDBY";
        micBtn.classList.remove('recording');
        avatarCard.className = "avatar-card";
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
      };
    }

    function startListening() {
      if (recognition) recognition.start();
      else alert("Browser tidak mendukung Web Speech API.");
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';

      utter.onstart = () => {
        statusText.innerText = "BERBICARA...";
        avatarCard.className = "avatar-card speaking";
      };

      utter.onend = () => {
        statusText.innerText = "SYSTEM STANDBY";
        avatarCard.className = "avatar-card";
      };

      window.speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
