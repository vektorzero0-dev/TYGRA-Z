<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYGRA-Z // Cybernetic Apex AI</title>
  <style>
    :root { --gold: #ffd700; --cyan: #00f0ff; --bg: #030408; }
    * { box-sizing: border-box; }
    body { background-color: var(--bg); color: #fff; font-family: 'Consolas', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
    .dev-header { position: absolute; top: 15px; left: 20px; z-index: 30; background: rgba(10,14,23,0.85); padding: 10px 18px; border-radius: 8px; border-left: 3px solid var(--gold); font-size: 13px; }
    .dev-header .title { color: var(--gold); font-weight: bold; font-size: 16px; }
    .dev-header a { color: var(--cyan); text-decoration: none; }
    #canvas-container { flex: 1; width: 100%; height: 100%; position: relative; }
    #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; color: var(--gold); }
    .ui-bottom { width: 100%; padding: 20px; position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center; z-index: 20; background: linear-gradient(to top, rgba(3,4,8,0.95), transparent); }
    .status-badge { padding: 6px 16px; border-radius: 20px; background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.4); color: var(--gold); font-size: 11px; letter-spacing: 2px; margin-bottom: 12px; }
    #response-box { width: 90%; max-width: 600px; text-align: center; font-size: 14px; color: #ececec; min-height: 50px; background: rgba(10,14,23,0.85); padding: 12px; border-radius: 8px; border: 1px solid rgba(0,240,255,0.25); margin-bottom: 15px; }
    .btn-mic { width: 65px; height: 65px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #b8860b); border: 2px solid var(--cyan); cursor: pointer; box-shadow: 0 0 25px rgba(255,215,0,0.4); display: flex; align-items: center; justify-content: center; }
    .btn-mic svg { width: 30px; height: 30px; fill: #000; }
    .btn-mic.recording { background: #ff3344; animation: pulse 0.8s infinite alternate; }
    @keyframes pulse { 0% { box-shadow: 0 0 15px #ff3344; } 100% { box-shadow: 0 0 35px #ff3344; } }
  </style>
</head>
<body>

  <div class="dev-header">
    <div class="title">TYGRA-Z AI</div>
    <div>Developer: <b>Zeeo</b></div>
    <div>Email: <a href="mailto:Vektorzero0@gmail.com">Vektorzero0@gmail.com</a></div>
  </div>

  <div id="loading-screen">
    <h3 style="letter-spacing:2px;">[ MEMUAT MODEL 3D FISIK TYGRA-Z ]</h3>
    <div style="color:var(--cyan); font-size:14px;">Mengunduh struktur 3D...</div>
  </div>

  <div id="canvas-container"></div>

  <div class="ui-bottom">
    <div class="status-badge" id="statusText">SYSTEM STANDBY</div>
    <div id="response-box">Tekan mikrofon untuk berbicara dengan TYGRA-Z...</div>
    <button class="btn-mic" id="micBtn" onclick="startListening()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, mixer, clock, controls, tigerModel;
    const container = document.getElementById('canvas-container');

    function init3D() {
      clock = new THREE.Clock();
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030408);

      camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.2, 3.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.8, 0);

      // Pencahayaan Emas & Cyan Sinematik
      const dirLight = new THREE.DirectionalLight(0xffd700, 2.5);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      const cyanLight = new THREE.PointLight(0x00f0ff, 2, 10);
      cyanLight.position.set(-3, 2, -2);
      scene.add(cyanLight);

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));

      // Jalur CDN jsDelivr Khusus (Bypass CORS Error)
      const loader = new THREE.GLTFLoader();
      const modelUrl = 'https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Tiger/glTF-Binary/Tiger.glb';

      loader.load(modelUrl, function (gltf) {
        tigerModel = gltf.scene;
        tigerModel.scale.set(0.45, 0.45, 0.45);
        tigerModel.position.set(0, 0, 0);

        scene.add(tigerModel);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(tigerModel);
          mixer.clipAction(gltf.animations[0]).play();
        }

        document.getElementById('loading-screen').style.display = 'none';
        animate();
      }, undefined, function (err) {
        document.getElementById('loading-screen').innerHTML = "<div style='color:#ff3344;'>Koneksi CDN terganggu. Coba refresh halaman.</div>";
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      if (mixer) mixer.update(clock.getDelta());
      controls.update();
      renderer.render(scene, camera);
    }

    init3D();

    // Voice & Backend integration
    const statusText = document.getElementById('statusText');
    const responseBox = document.getElementById('response-box');
    const micBtn = document.getElementById('micBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'id-ID';
      recognition.onstart = () => { statusText.innerText = "MENDENGARKAN..."; micBtn.classList.add('recording'); };
      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        responseBox.innerText = `User: "${text}"`;
        statusText.innerText = "MEMPROSES DATA...";

        try {
          const res = await fetch('https://tygra-z-backend.onrender.com/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: text })
          });
          const data = await res.json();
          responseBox.innerText = data.reply;
          speak(data.reply);
        } catch (err) {
          responseBox.innerText = "Gagal terhubung ke backend server.";
          statusText.innerText = "SYSTEM ERROR";
        }
      };
      recognition.onerror = () => { statusText.innerText = "SYSTEM STANDBY"; micBtn.classList.remove('recording'); };
      recognition.onend = () => { micBtn.classList.remove('recording'); };
    }

    function startListening() {
      if (recognition) recognition.start();
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      utter.onstart = () => { statusText.innerText = "BERBICARA..."; };
      utter.onend = () => { statusText.innerText = "SYSTEM STANDBY"; };
      window.speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
