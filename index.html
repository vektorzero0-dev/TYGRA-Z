<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYGRA-Z // Cyber Tiger AI</title>
  <style>
    :root {
      --gold: #ffd700;
      --cyan: #00f0ff;
      --bg: #05050a;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Consolas', 'Segoe UI', monospace;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* Header Developer Information */
    .dev-header {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 20;
      background: rgba(10, 11, 16, 0.85);
      padding: 10px 18px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .dev-header .title {
      color: var(--gold);
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 3px;
    }

    .dev-header a {
      color: var(--cyan);
      text-decoration: none;
    }

    /* Avatar Container dengan Efek Aura */
    .avatar-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin-top: 40px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--gold), #8a6d00, var(--cyan));
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3), 0 0 40px rgba(0, 240, 255, 0.2);
      transition: all 0.3s ease;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #101118;
    }

    /* Animasi Status Avatar */
    .avatar-container.listening {
      animation: pulse-blue 1.2s infinite alternate;
    }

    .avatar-container.speaking {
      animation: pulse-gold 0.8s infinite alternate;
    }

    @keyframes pulse-blue {
      0% { box-shadow: 0 0 20px var(--cyan); }
      100% { box-shadow: 0 0 60px var(--cyan), 0 0 90px var(--cyan); }
    }

    @keyframes pulse-gold {
      0% { box-shadow: 0 0 20px var(--gold); }
      100% { box-shadow: 0 0 70px var(--gold), 0 0 100px var(--gold); }
    }

    /* Status Badge */
    .status-badge {
      margin-top: 25px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #response-box {
      margin-top: 15px;
      width: 85%;
      max-width: 550px;
      text-align: center;
      font-size: 15px;
      color: #ececec;
      min-height: 55px;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .btn-mic {
      margin-top: 20px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #b8860b);
      border: none;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .btn-mic:hover { transform: scale(1.1); }
    .btn-mic svg { width: 28px; height: 28px; fill: #000; }
    .btn-mic.recording { background: #ff4444; animation: pulse-red 1s infinite; }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 10px #ff4444; }
      100% { box-shadow: 0 0 25px #ff4444; }
    }

    /* Modal API Key */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; align-items: center;
      justify-content: center; z-index: 100;
    }
    .modal-content {
      background: #101118; padding: 30px; border-radius: 12px;
      border: 1px solid var(--gold); text-align: center; max-width: 350px;
    }
    .modal input {
      width: 90%; padding: 12px; margin: 15px 0; background: #000;
      border: 1px solid var(--cyan); color: #fff; border-radius: 6px;
    }
    .modal button {
      padding: 12px 24px; background: var(--gold); border: none;
      font-weight: bold; border-radius: 6px; cursor: pointer; color: #000;
    }
  </style>
</head>
<body>

  <!-- Dev Header -->
  <div class="dev-header">
    <div class="title">TYGRA-Z AI</div>
    <div>Developer: <b>Zeeo</b></div>
    <div>Email: <a href="mailto:Vektorzero0@gmail.com">Vektorzero0@gmail.com</a></div>
  </div>

  <!-- Modal API Key -->
  <div id="apiModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3 style="color:var(--gold); margin-top:0;">TYGRA-Z API Key</h3>
      <p style="font-size:12px; color:#aaa;">Masukkan Gemini API Key kamu dari aistudio.google.com:</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <button onclick="saveApiKey()">Simpan & Mulai</button>
    </div>
  </div>

  <!-- Avatar Robot Cyberpunk -->
  <div class="avatar-container" id="avatarCard">
    <img src="https://images.unsplash.com/photo-1561731216-c3a4d99437d5?auto=format&fit=crop&w=600&q=80" class="avatar-img" alt="TYGRA-Z">
  </div>

  <div class="status-badge" id="statusText">SYSTEM STANDBY</div>
  <div id="response-box">Tekan mikrofon untuk berbicara dengan TYGRA-Z...</div>

  <button class="btn-mic" id="micBtn" onclick="startListening()">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </button>

  <script>
    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';
    if (!apiKey) document.getElementById('apiModal').style.display = 'flex';

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) {
        localStorage.setItem('GEMINI_API_KEY', val);
        apiKey = val;
        document.getElementById('apiModal').style.display = 'none';
      }
    }

    const avatarCard = document.getElementById('avatarCard');
    const statusText = document.getElementById('statusText');
    const responseBox = document.getElementById('response-box');
    const micBtn = document.getElementById('micBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'id-ID';
      
      recognition.onstart = () => {
        statusText.innerText = "MENDENGARKAN...";
        micBtn.classList.add('recording');
        avatarCard.className = "avatar-container listening";
      };

      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        responseBox.innerText = `User: "${text}"`;
        statusText.innerText = "MEMPROSES DATA...";
        
        const reply = await askGemini(text);
        responseBox.innerText = reply;
        speak(reply);
      };

      recognition.onerror = () => {
        statusText.innerText = "SYSTEM STANDBY";
        micBtn.classList.remove('recording');
        avatarCard.className = "avatar-container";
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
      };
    }

    function startListening() {
      if (!apiKey) {
        document.getElementById('apiModal').style.display = 'flex';
        return;
      }
      if (recognition) recognition.start();
      else alert("Browser tidak mendukung pengenalan suara.");
    }

    async function askGemini(prompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Nama kamu adalah TYGRA-Z, asisten AI robot harimau keemasan yang diciptakan oleh developer Zeeo. Jawablah dengan gaya tangkas, pintar, lugas, dan berwibawa khas cyberpunk/hacker dalam Bahasa Indonesia. Pertanyaan: ${prompt}` }] }]
          })
        });
        const data = await res.json();
        return data.candidates[0].content.parts[0].text;
      } catch (err) {
        return "Gagal terhubung ke mainframe AI.";
      }
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';

      utter.onstart = () => {
        statusText.innerText = "BERBICARA...";
        avatarCard.className = "avatar-container speaking";
      };

      utter.onend = () => {
        statusText.innerText = "SYSTEM STANDBY";
        avatarCard.className = "avatar-container";
      };

      window.speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
