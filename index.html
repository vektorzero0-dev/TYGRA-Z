<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYGRA-Z // Cyber Tiger AI</title>
  <style>
    :root {
      --gold: #ffd700;
      --cyan: #00f0ff;
      --bg: #05050a;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Consolas', 'Segoe UI', monospace, sans-serif;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header Developer Information */
    .dev-header {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 20;
      background: rgba(10, 11, 16, 0.85);
      padding: 10px 18px;
      border-radius: 8px;
      border-left: 3px solid var(--gold);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .dev-header .title {
      color: var(--gold);
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .dev-header .info {
      color: #aaa;
    }

    .dev-header a {
      color: var(--cyan);
      text-decoration: none;
    }

    /* Area Tampilan 3D */
    #robot-container {
      flex: 1;
      width: 100%;
      position: relative;
    }

    /* Overlay UI Bottom */
    .ui-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: var(--gold);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    #response-box {
      width: 90%;
      max-width: 600px;
      text-align: center;
      font-size: 15px;
      color: #ececec;
      min-height: 50px;
      margin-bottom: 15px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }

    .btn-mic {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #b8860b);
      border: none;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-mic:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255, 215, 0, 0.7); }
    .btn-mic svg { width: 28px; height: 28px; fill: #000; }
    .btn-mic.recording { background: #ff4444; box-shadow: 0 0 25px rgba(255, 68, 68, 0.8); animation: pulse-red 1s infinite; }

    @keyframes pulse-red { 0% { box-shadow: 0 0 10px #ff4444; } 100% { box-shadow: 0 0 25px #ff4444; } }

    /* Modal API Key */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: #101118; padding: 30px; border-radius: 12px; border: 1px solid var(--gold); text-align: center; max-width: 350px; }
    .modal input { width: 90%; padding: 12px; margin: 15px 0; background: #000; border: 1px solid var(--cyan); color: #fff; border-radius: 6px; }
    .modal button { padding: 12px 24px; background: var(--gold); border: none; font-weight: bold; border-radius: 6px; cursor: pointer; color: #000; }

    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 200;
      color: var(--gold);
    }
  </style>
</head>
<body>

  <!-- Informasi Developer -->
  <div class="dev-header">
    <div class="title">TYGRA-Z AI</div>
    <div class="info">Developer: <b>Zeeo</b></div>
    <div class="info">Email: <a href="mailto:Vektorzero0@gmail.com">Vektorzero0@gmail.com</a></div>
  </div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <h3 style="letter-spacing:2px;">[ INITIALIZING TYGRA-Z 3D ]</h3>
    <div style="color:var(--cyan); font-size:14px;">Memuat Sistem Robot Harimau...</div>
  </div>

  <!-- Modal API Key -->
  <div id="apiModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3 style="color:var(--gold); margin-top:0;">Gemini API Key</h3>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <button onclick="saveApiKey()">Simpan & Mulai</button>
    </div>
  </div>

  <!-- Area 3D Three.js -->
  <div id="robot-container"></div>

  <!-- Overlay UI -->
  <div class="ui-container">
    <div class="status-badge" id="statusText">SYSTEM STANDBY</div>
    <div id="response-box">Tekan mikrofon untuk berbicara dengan TYGRA-Z...</div>
    <button class="btn-mic" id="micBtn" onclick="startListening()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
  </div>

  <!-- Library 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>

  <script>
    // --- THREE.JS CONFIGURATION ---
    let scene, camera, renderer, mixer, clock, tigerModel;
    let walkAction;
    const container = document.getElementById('robot-container');

    function init3D() {
      clock = new THREE.Clock();
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05050a);
      scene.fog = new THREE.Fog(0x05050a, 10, 50);

      camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1, 0);
      controls.update();

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffd700, 1.2);
      dirLight.position.set(3, 10, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const ambientLight = new THREE.AmbientLight(0x00f0ff, 0.3);
      scene.add(ambientLight);

      const loader = new THREE.GLTFLoader();
      const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Tiger/glTF-Binary/Tiger.glb';

      loader.load(modelUrl, function (gltf) {
        tigerModel = gltf.scene;
        tigerModel.scale.set(0.5, 0.5, 0.5);
        tigerModel.traverse(function (object) {
          if (object.isMesh) object.castShadow = true;
        });
        scene.add(tigerModel);

        mixer = new THREE.AnimationMixer(tigerModel);
        if (gltf.animations && gltf.animations.length > 0) {
          walkAction = mixer.clipAction(gltf.animations[0]);
          walkAction.play();
        }

        document.getElementById('loading-screen').style.display = 'none';
        animate();
      }, undefined, function (error) {
        console.error(error);
        document.getElementById('loading-screen').innerHTML = "Gagal memuat model 3D.";
      });

      window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }

    init3D();

    // --- GEMINI 3.5 & VOICE LOGIC ---
    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';
    if (!apiKey) document.getElementById('apiModal').style.display = 'flex';

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) { localStorage.setItem('GEMINI_API_KEY', val); apiKey = val; document.getElementById('apiModal').style.display = 'none'; }
    }

    const statusText = document.getElementById('statusText');
    const responseBox = document.getElementById('response-box');
    const micBtn = document.getElementById('micBtn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'id-ID';
      recognition.onstart = () => { statusText.innerText = "MENDENGARKAN..."; micBtn.classList.add('recording'); };
      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        responseBox.innerText = `User: "${text}"`;
        statusText.innerText = "MEMPROSES DATA (GEMINI 3.5)...";
        const reply = await askGemini(text);
        responseBox.innerText = reply;
        speak(reply);
      };
      recognition.onerror = () => { statusText.innerText = "SYSTEM STANDBY"; micBtn.classList.remove('recording'); };
      recognition.onend = () => { micBtn.classList.remove('recording'); };
    }

    function startListening() {
      if (!apiKey) { document.getElementById('apiModal').style.display = 'flex'; return; }
      if (recognition) recognition.start();
    }

    async function askGemini(prompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Nama kamu adalah TYGRA-Z, asisten AI robot harimau keemasan yang diciptakan oleh developer Zeeo. Jawablah dengan gaya tangkas, pintar, lugas, dan berwibawa khas cyberpunk/hacker dalam Bahasa Indonesia. Pertanyaan: ${prompt}` }] }]
          })
        });
        const data = await res.json();
        return data.candidates[0].content.parts[0].text;
      } catch (err) { return "Gagal terhubung ke mainframe AI."; }
    }

    function speak(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      utter.onstart = () => { statusText.innerText = "BERBICARA..."; };
      utter.onend = () => { statusText.innerText = "SYSTEM STANDBY"; };
      window.speechSynthesis.speak(utter);
    }
  </script>
</body>
</html>
